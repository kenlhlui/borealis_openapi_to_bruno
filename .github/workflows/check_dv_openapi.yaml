name: Check Dataverse OpenAPI availability

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

    
permissions:
  contents: write

concurrency:
  group: openapi-availability
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Check OpenAPI availability
        run: uv run scripts/check_openapi.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: 'OPENAPI_AVAILABILITY.md'
          commit_message: Update OpenAPI availability report [skip ci]